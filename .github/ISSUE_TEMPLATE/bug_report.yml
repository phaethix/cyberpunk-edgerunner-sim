name: Bug report
description: Report a problem with the game or its deployment
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Start the server with `python -m server.main`
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Local (running the server myself)
        - Hugging Face Space deployment
        - Terminal version (cyberpunk.py)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any error output or attach screenshots.
      render: shell
    validations:
      required: false
